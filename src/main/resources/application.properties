######################### LIQUIBASE ###############################
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=university_app_liquibase
spring.liquibase.enabled=true
spring.liquibase.contexts=development
spring.liquibase.drop-first=false
####################### REDIS CACHE ###################################
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=6000
# timeout(ms da) --->> redis ni ozini serveriga agar connection bolmasa 6 sekund ushlab turadi agar connection bolmasa automatik uzib yuboradi
spring.cache.redis.time-to-live=600000
# time-to-live (ms larda) -->> bu har 10 minutda Redis malumotlari tozalandi