version: '3.8'

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin_username
      MINIO_ROOT_PASSWORD: adminpassword123
    command: server /data --console-address ":9001"
    networks:
      - university-net

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: code
      POSTGRES_DB: spring_boot_app
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5433"
    networks:
      - university-net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    command: [ "redis-server", "--appendonly", "yes" , "--requirepass", "redisAdmin"]
    volumes:
      - redis_data:/data
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redisAdmin
    depends_on:
      - redis
volumes:
  minio_data:
  pg_data:
  redis_data:

networks:
  university-net:
    driver: bridge